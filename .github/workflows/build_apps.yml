name: Build Android APK and iOS App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK (Release)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android APK (Fat APK + Split per ABI)
        run: |
          flutter build apk --release
          flutter build apk --release --split-per-abi

      - name: Upload Android Release APKs
        uses: actions/upload-artifact@v4
        with:
          name: Archimedes-Android-APK
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 14

  build-ios:
    name: Build iOS Application (Runner / IPA)
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build iOS (No Codesign for Artifact Extraction)
        run: |
          flutter build ios --release --no-codesign

      - name: Package Unsigned Payload into .ipa
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r Archimedes-iOS-unsigned.ipa Payload/

      - name: Upload iOS Application Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Archimedes-iOS-IPA
          path: build/ios/iphoneos/Archimedes-iOS-unsigned.ipa
          retention-days: 14
